<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#333"/>
  </marker>
  <style>
    .title{font:bold 28px Arial;fill:#111}.head{font:bold 18px Arial;fill:#333}
    .label{font:16px Arial;fill:#222}.small{font:13px Arial;fill:#555}
    .box{fill:#f8f9fa;stroke:#333;stroke-width:2}.fail{fill:#fff1f1;stroke:#a33;stroke-width:2}
    .fallback{fill:#f1f8ff;stroke:#357;stroke-width:2}.third{fill:#fff6df;stroke:#9a6700;stroke-width:2}
    .eval{fill:#f4f1ff;stroke:#6546a5;stroke-width:2}.boundary{fill:none;stroke:#666;stroke-width:2.5;stroke-dasharray:9 7}
    .arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#777;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<text x="700" y="38" text-anchor="middle" class="title">Advanced RAG Customer Support Architecture + Fallbacks</text>

<rect x="35" y="65" width="930" height="785" rx="18" class="boundary"/>
<text x="55" y="93" class="head">YOUR SYSTEM</text>

<!-- Main path -->
<rect x="65" y="135" width="155" height="70" rx="12" class="box"/>
<text x="142" y="165" text-anchor="middle" class="label">User</text>
<text x="142" y="188" text-anchor="middle" class="small">Customer query</text>

<rect x="270" y="125" width="190" height="90" rx="12" class="box"/>
<text x="365" y="160" text-anchor="middle" class="label">RAG Pipeline</text>
<text x="365" y="184" text-anchor="middle" class="small">Retrieve + augment</text>
<text x="365" y="203" text-anchor="middle" class="small">Generate</text>

<rect x="270" y="290" width="190" height="90" rx="12" class="box"/>
<text x="365" y="325" text-anchor="middle" class="label">Vector Store</text>
<text x="365" y="349" text-anchor="middle" class="small">Knowledge embeddings</text>
<text x="365" y="368" text-anchor="middle" class="small">Top-k retrieval</text>

<rect x="525" y="125" width="190" height="90" rx="12" class="box"/>
<text x="620" y="160" text-anchor="middle" class="label">LLM Router</text>
<text x="620" y="184" text-anchor="middle" class="small">Provider selection</text>
<text x="620" y="203" text-anchor="middle" class="small">Retry / rate-limit handling</text>

<rect x="780" y="125" width="145" height="90" rx="12" class="box"/>
<text x="852" y="160" text-anchor="middle" class="label">Eval Collector</text>
<text x="852" y="184" text-anchor="middle" class="small">Inputs + outputs</text>
<text x="852" y="203" text-anchor="middle" class="small">metrics</text>

<rect x="270" y="470" width="190" height="85" rx="12" class="box"/>
<text x="365" y="505" text-anchor="middle" class="label">Response Guard</text>
<text x="365" y="530" text-anchor="middle" class="small">Validate + cite</text>

<rect x="525" y="470" width="190" height="85" rx="12" class="eval"/>
<text x="620" y="505" text-anchor="middle" class="label">Eval Monitor</text>
<text x="620" y="530" text-anchor="middle" class="small">Quality thresholds</text>

<rect x="780" y="470" width="145" height="85" rx="12" class="fallback"/>
<text x="852" y="505" text-anchor="middle" class="label">Alert / Rollback</text>
<text x="852" y="530" text-anchor="middle" class="small">Last-known-good</text>

<!-- Third party -->
<rect x="1030" y="125" width="320" height="260" rx="16" class="third"/>
<text x="1190" y="160" text-anchor="middle" class="head">THIRD-PARTY</text>
<rect x="1070" y="195" width="240" height="70" rx="12" class="third"/>
<text x="1190" y="224" text-anchor="middle" class="label">Primary LLM API</text>
<text x="1190" y="247" text-anchor="middle" class="small">Hosted inference</text>
<rect x="1070" y="285" width="240" height="70" rx="12" class="third"/>
<text x="1190" y="314" text-anchor="middle" class="label">Fallback LLM API</text>
<text x="1190" y="337" text-anchor="middle" class="small">Alternate provider/model</text>

<!-- Main arrows -->
<path d="M220 170H270" class="arrow"/><text x="245" y="158" text-anchor="middle" class="small">query</text>
<path d="M365 215V290" class="arrow"/><text x="415" y="255" class="small">search</text>
<path d="M460 170H525" class="arrow"/><text x="492" y="158" text-anchor="middle" class="small">context + prompt</text>
<path d="M715 170H1030" class="arrow"/><text x="870" y="158" text-anchor="middle" class="small">LLM request</text>
<path d="M1030 230H715" class="arrow"/><text x="870" y="218" text-anchor="middle" class="small">response</text>
<path d="M620 215V470" class="arrow"/><text x="650" y="340" class="small">generated output</text>
<path d="M460 512H525" class="arrow"/><text x="492" y="500" text-anchor="middle" class="small">answer</text>
<path d="M715 512H780" class="arrow"/><text x="748" y="500" text-anchor="middle" class="small">threshold result</text>
<path d="M852 215V470" class="dash"/><text x="875" y="350" class="small">eval metrics</text>

<!-- Failure points and fallbacks -->
<rect x="65" y="270" width="155" height="105" rx="12" class="fail"/>
<text x="142" y="300" text-anchor="middle" class="label">FAILURE 1</text>
<text x="142" y="323" text-anchor="middle" class="small">Vector store down</text>
<text x="142" y="345" text-anchor="middle" class="small">or retrieval timeout</text>
<text x="142" y="367" text-anchor="middle" class="small">→ use cached/keyword</text>

<rect x="65" y="400" width="155" height="90" rx="12" class="fallback"/>
<text x="142" y="433" text-anchor="middle" class="label">Fallback</text>
<text x="142" y="456" text-anchor="middle" class="small">Cached FAQs / keyword</text>
<text x="142" y="477" text-anchor="middle" class="small">retrieval</text>
<path d="M270 335H220" class="dash"/>

<rect x="780" y="270" width="145" height="105" rx="12" class="fail"/>
<text x="852" y="300" text-anchor="middle" class="label">FAILURE 2</text>
<text x="852" y="323" text-anchor="middle" class="small">LLM timeout /</text>
<text x="852" y="345" text-anchor="middle" class="small">rate limit</text>
<text x="852" y="367" text-anchor="middle" class="small">→ retry + fallback</text>
<path d="M852 270V215" class="dash"/>
<path d="M925 322H1070" class="dash"/>

<rect x="1030" y="410" width="320" height="115" rx="16" class="fallback"/>
<text x="1190" y="442" text-anchor="middle" class="label">Fallback behavior</text>
<text x="1190" y="466" text-anchor="middle" class="small">Retry with backoff, then</text>
<text x="1190" y="488" text-anchor="middle" class="small">route to alternate LLM.</text>

<rect x="65" y="590" width="395" height="115" rx="12" class="fail"/>
<text x="262" y="620" text-anchor="middle" class="label">FAILURE 3 — Low-quality / unsafe output</text>
<text x="262" y="646" text-anchor="middle" class="small">Eval metric falls below threshold</text>
<text x="262" y="669" text-anchor="middle" class="small">→ alert + rollback to last-known-good</text>
<text x="262" y="692" text-anchor="middle" class="small">prompt/model configuration</text>

<path d="M365 555V590" class="dash"/>

<!-- Scaling -->
<rect x="525" y="590" width="400" height="115" rx="12" class="box"/>
<text x="725" y="620" text-anchor="middle" class="label">SCALING CONSIDERATION</text>
<text x="725" y="646" text-anchor="middle" class="small">LLM API / router is the first bottleneck</text>
<text x="725" y="669" text-anchor="middle" class="small">because inference latency and rate limits grow</text>
<text x="725" y="692" text-anchor="middle" class="small">→ cache common answers + queue + load-balance providers</text>

<!-- Eval note -->
<text x="525" y="770" class="head">Eval integration:</text>
<text x="525" y="794" class="small">Eval Collector → Eval Monitor → alert when metric threshold is breached;</text>
<text x="525" y="816" class="small">if the breach persists, rollback to the last-known-good model/prompt.</text>

</svg>