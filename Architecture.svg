<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#333"/>
</marker>
<style>
.title{font:bold 28px Arial;fill:#111}
.heading{font:bold 18px Arial;fill:#333}
.label{font:16px Arial;fill:#222}
.small{font:14px Arial;fill:#555}
.box{fill:#f8f9fa;stroke:#333;stroke-width:2}
.third{fill:#fff6df;stroke:#9a6700;stroke-width:2}
.boundary{fill:none;stroke:#666;stroke-width:2.5;stroke-dasharray:9 7}
.arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style>
</defs>

<text x="600" y="40" text-anchor="middle" class="title">
RAG Customer Support Assistant
</text>

<!-- YOUR SYSTEM boundary -->
<rect x="40" y="75" width="800" height="590" rx="18" class="boundary"/>
<text x="60" y="103" class="heading">YOUR SYSTEM</text>

<!-- Components -->
<rect x="75" y="150" width="170" height="75" rx="12" class="box"/>
<text x="160" y="183" text-anchor="middle" class="label">User</text>
<text x="160" y="207" text-anchor="middle" class="small">Customer query</text>

<rect x="305" y="130" width="215" height="105" rx="12" class="box"/>
<text x="412" y="169" text-anchor="middle" class="label">RAG Pipeline</text>
<text x="412" y="193" text-anchor="middle" class="small">Retrieve + augment</text>
<text x="412" y="216" text-anchor="middle" class="small">Generate answer</text>

<rect x="305" y="320" width="215" height="95" rx="12" class="box"/>
<text x="412" y="357" text-anchor="middle" class="label">Vector Store</text>
<text x="412" y="381" text-anchor="middle" class="small">Support knowledge</text>
<text x="412" y="402" text-anchor="middle" class="small">embeddings</text>

<rect x="600" y="320" width="200" height="95" rx="12" class="box"/>
<text x="700" y="357" text-anchor="middle" class="label">LLM Router</text>
<text x="700" y="382" text-anchor="middle" class="small">Provider selection</text>

<rect x="600" y="130" width="200" height="105" rx="12" class="box"/>
<text x="700" y="169" text-anchor="middle" class="label">Eval Collector</text>
<text x="700" y="193" text-anchor="middle" class="small">Captures inputs</text>
<text x="700" y="216" text-anchor="middle" class="small">and outputs</text>

<rect x="305" y="510" width="215" height="95" rx="12" class="box"/>
<text x="412" y="547" text-anchor="middle" class="label">Response Formatter</text>
<text x="412" y="572" text-anchor="middle" class="small">Final answer + citations</text>

<!-- Data flow -->
<path d="M245 188H305" class="arrow"/>
<text x="275" y="176" text-anchor="middle" class="small">query</text>

<path d="M412 235V320" class="arrow"/>
<text x="465" y="282" class="small">search</text>

<path d="M520 183H600" class="arrow"/>
<text x="560" y="171" text-anchor="middle" class="small">prompt</text>

<path d="M700 320V235" class="arrow"/>
<text x="755" y="280" class="small">LLM request</text>

<path d="M600 365H520" class="arrow"/>
<text x="560" y="350" text-anchor="middle" class="small">context</text>

<path d="M412 415V510" class="arrow"/>
<text x="470" y="466" class="small">generated answer</text>

<path d="M305 558H160V225" class="arrow"/>
<text x="220" y="540" text-anchor="middle" class="small">final response</text>

<path d="M600 183H520" class="arrow"/>
<text x="560" y="214" text-anchor="middle" class="small">eval data</text>

<!-- Eval note -->
<text x="603" y="275" class="small">NOTE: Eval Collector sits</text>
<text x="603" y="294" class="small">inside the application boundary.</text>

<!-- THIRD PARTY -->
<rect x="910" y="145" width="235" height="270" rx="15" class="third"/>
<text x="1027" y="182" text-anchor="middle" class="heading">THIRD-PARTY</text>
<text x="1027" y="225" text-anchor="middle" class="label">OpenAI API</text>
<text x="1027" y="252" text-anchor="middle" class="small">Hosted LLM</text>
<text x="1027" y="282" text-anchor="middle" class="small">External inference</text>

<path d="M800 350L910 275" class="arrow"/>
<text x="854" y="300" text-anchor="middle" class="small">API request</text>

<path d="M910 335L800 395" class="arrow"/>
<text x="854" y="391" text-anchor="middle" class="small">response</text>

</svg>
